<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSLEO.ISO | Cinematic Photography</title>
    
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Inter:wght@300;400&display=swap');
        
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, .font-serif {
            font-family: 'Cormorant Garamond', serif;
        }

        .img-container {
            cursor: zoom-in;
            transition: opacity 0.6s ease;
        }

        .img-container:hover img {
            transform: scale(1.02);
        }

        .lightbox-overlay {
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(10px);
        }

        /* Hide scrollbar but keep functionality */
        ::-webkit-scrollbar { display: none; }
        html { scroll-behavior: smooth; }

        .fade-in {
            animation: fadeIn 1.2s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconClose = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg>;
        const IconChevronLeft = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M15 18l-6-6 6-6"/></svg>;
        const IconChevronRight = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M9 18l6-6-6-6"/></svg>;

        const App = () => {
            const [selectedId, setSelectedId] = useState(null);
            const [filter, setFilter] = useState("All");

            const gallery = [
                { id: 1, cat: "Wildlife", src: "Gatto_Nero.JPG", title: "Feline Shadows", intent: "Capturing the predatory focus in low-key lighting." },
                { id: 2, cat: "Landscape", src: "Quella_Suprema.jpg", title: "Alpine Motion", intent: "A study of long-exposure textures in the Swiss Alps." },
                { id: 3, cat: "Portraits", src: "Gnocha_Ginger_Su_Moto.jpg", title: "Vagabond", intent: "The intersection of machine and human spirit." },
                { id: 4, cat: "Wildlife", src: "Uccelin.JPG", title: "Isolation", intent: "Minimalist composition of local Swiss fauna." },
                { id: 5, cat: "Landscape", src: "Fiume.jpg", title: "Blue Hour", intent: "The silence of the river at twilight." },
                { id: 6, cat: "Landscape", src: "Acqua_nuvola.jpg", title: "Mist", intent: "Where the sky and ocean lose their boundaries." },
                { id: 7, cat: "Landscape", src: "Blessed_ahh.jpg", title: "Light Rays", intent: "Intentional overexposure to convey a sense of hope." },
                { id: 8, cat: "Landscape", src: "Piccolo_farm_Spotv.2.jpg", title: "Pastoral", intent: "The geometric beauty of Swiss agriculture." },
                { id: 9, cat: "Portraits", src: "Moto_cicco.jpg", title: "Mechanic", intent: "High contrast study of texture and chrome." },
            ];

            const filteredGallery = filter === "All" ? gallery : gallery.filter(img => img.cat === filter);
            const selectedImg = gallery.find(img => img.id === selectedId);

            return (
                <div className="min-h-screen">
                    {/* Navigation - Ultra Minimalist */}
                    <nav className="fixed top-0 w-full z-50 p-8 flex justify-between items-center mix-blend-difference">
                        <div className="text-xl tracking-[0.3em] font-light">ITSLEO.ISO</div>
                        <div className="flex gap-8 text-[10px] tracking-widest uppercase opacity-60 hover:opacity-100 transition-opacity">
                            <a href="#work">Work</a>
                            <a href="#philosophy">Philosophy</a>
                            <a href="#contact">Contact</a>
                        </div>
                    </nav>

                    {/* Full-Screen Hero - Lead with your best image */}
                    <header className="h-screen w-full relative overflow-hidden bg-black">
                        <img 
                            src="https://images.unsplash.com/photo-1452587925148-ce544e77e70d?q=80&w=1920&auto=format&fit=crop" 
                            className="w-full h-full object-cover opacity-60"
                            alt="Hero"
                        />
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-4">
                            <h1 className="text-6xl md:text-9xl font-light tracking-tight mb-4 fade-in">
                                Cinematic <span className="italic">Reality</span>
                            </h1>
                            <p className="font-serif text-xl md:text-3xl italic opacity-80 fade-in" style={{animationDelay: '0.3s'}}>
                                Photography by Leo. Based in Switzerland.
                            </p>
                        </div>
                        <div className="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce opacity-30">
                            ↓
                        </div>
                    </header>

                    {/* Filter / Curation Control */}
                    <section id="work" className="pt-32 pb-12 px-8">
                        <div className="flex justify-center gap-12 text-[11px] tracking-[0.2em] uppercase opacity-40">
                            {["All", "Wildlife", "Landscape", "Portraits"].map(c => (
                                <button 
                                    key={c} 
                                    onClick={() => setFilter(c)}
                                    className={`hover:text-white transition-colors ${filter === c ? 'text-white opacity-100' : ''}`}
                                >
                                    {c}
                                </button>
                            ))}
                        </div>
                    </section>

                    {/* Grid - High White Space */}
                    <main className="px-8 md:px-24 pb-32">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16 md:gap-24">
                            {filteredGallery.map(img => (
                                <div 
                                    key={img.id} 
                                    className="img-container flex flex-col group"
                                    onClick={() => setSelectedId(img.id)}
                                >
                                    <div className="aspect-[4/5] overflow-hidden bg-zinc-900 mb-6">
                                        <img 
                                            src={img.src} 
                                            className="w-full h-full object-cover transition-transform duration-1000" 
                                            loading="lazy"
                                        />
                                    </div>
                                    <h3 className="text-xs tracking-widest uppercase mb-2 opacity-80">{img.title}</h3>
                                    <p className="font-serif italic text-sm opacity-40 group-hover:opacity-80 transition-opacity">
                                        {img.intent}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* Philosophy - No "Student" talk */}
                    <section id="philosophy" className="py-40 bg-white text-black text-center px-8">
                        <div className="max-w-2xl mx-auto">
                            <h2 className="text-4xl md:text-6xl mb-12">The Intent</h2>
                            <p className="font-serif text-2xl md:text-3xl leading-relaxed italic">
                                "I don't seek to document events, but to isolate the emotion within them. Through high-contrast Swiss landscapes and cinematic portraits, I look for the narrative hidden in the shadows."
                            </p>
                            <div className="mt-12 h-px w-24 bg-black/10 mx-auto"></div>
                        </div>
                    </section>

                    {/* Contact - Clean & Direct */}
                    <footer id="contact" className="py-32 px-8 border-t border-white/5 text-center">
                        <p className="text-[10px] tracking-[0.5em] uppercase opacity-40 mb-8 font-bold">Inquiries</p>
                        <a href="mailto:itsleo.iso.contact@gmail.com" className="text-3xl md:text-5xl font-light hover:opacity-50 transition-opacity tracking-tight">
                            itsleo.iso.contact@gmail.com
                        </a>
                        <div className="mt-24 text-[10px] tracking-widest opacity-30">
                            SWITZERLAND © {new Date().getFullYear()}
                        </div>
                    </footer>

                    {/* Lightbox / Full-screen View */}
                    {selectedId && (
                        <div className="fixed inset-0 z-[100] lightbox-overlay flex items-center justify-center p-4 md:p-12 animate-in fade-in duration-300">
                            <button 
                                onClick={() => setSelectedId(null)}
                                className="absolute top-8 right-8 text-white/50 hover:text-white transition-colors"
                            >
                                <IconClose />
                            </button>
                            
                            <div className="max-w-6xl w-full h-full flex flex-col md:flex-row items-center gap-12">
                                <div className="flex-1 h-full flex items-center justify-center">
                                    <img 
                                        src={selectedImg.src} 
                                        className="max-w-full max-h-full object-contain shadow-2xl"
                                    />
                                </div>
                                <div className="md:w-64 text-left">
                                    <span className="text-[10px] tracking-[0.3em] uppercase text-white/40 mb-4 block">
                                        {selectedImg.cat}
                                    </span>
                                    <h4 className="text-3xl font-light mb-4 tracking-tight">{selectedImg.title}</h4>
                                    <p className="font-serif italic text-lg text-white/60 leading-relaxed">
                                        {selectedImg.intent}
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
