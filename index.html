<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSLEO.ISO | Cinematic Photography</title>
    
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400&display=swap');
        
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            /* Simple deterrent for image theft */
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        h1, h2, h3, .font-serif {
            font-family: 'Cormorant Garamond', serif;
        }

        .img-container {
            cursor: zoom-in;
            transition: opacity 0.6s ease;
            position: relative;
        }

        /* Prevent dragging images */
        img {
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .img-container:hover img {
            transform: scale(1.03);
        }

        .lightbox-overlay {
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(15px);
        }

        /* Hide scrollbar but keep functionality */
        ::-webkit-scrollbar { display: none; }
        html { scroll-behavior: smooth; }

        .fade-in {
            animation: fadeIn 1.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconClose = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2"><path d="M18 6L6 18M6 6l12 12"/></svg>;
        const IconInstagram = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>;

        const App = () => {
            const [selectedId, setSelectedId] = useState(null);
            const [filter, setFilter] = useState("All");
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const gallery = [
                { id: 1, cat: "Wildlife", src: "Gatto_Nero.JPG", title: "Feline Shadows", intent: "The silence of a hunter. Captured in the low Swiss sun to emphasize the depth of the blacks." },
                { id: 2, cat: "Landscape", src: "Quella_Suprema.jpg", title: "Alpine Motion", intent: "A meditation on the permanence of mountains versus the transience of clouds." },
                { id: 3, cat: "Portrait", src: "Gnocha_Ginger_Su_Moto.jpg", title: "Vagabond", intent: "Natural light study. Looking for the raw narrative between subject and machine." },
                { id: 4, cat: "Wildlife", src: "Uccelin.JPG", title: "Isolation", intent: "One small life against the vastness of the Swiss winter." },
                { id: 5, cat: "Landscape", src: "Fiume.jpg", title: "Blue Hour", intent: "The river as a mirror. Long exposure used to turn water into silk." },
                { id: 6, cat: "Landscape", src: "Acqua_nuvola.jpg", title: "Mist", intent: "High-key landscape exploring the boundary where water becomes sky." },
                { id: 7, cat: "Landscape", src: "Blessed_ahh.jpg", title: "Light Rays", intent: "Chasing the 'God Rays' through a forest canopy near Zurich." },
                { id: 8, cat: "Landscape", src: "Piccolo_farm_Spotv.2.jpg", title: "Pastoral", intent: "Geometric patterns in agriculture, showcasing the organized beauty of our hills." },
                { id: 9, cat: "Portrait", src: "Moto_cicco.jpg", title: "Mechanic", intent: "Close-up textural study. Chrome, oil, and the stories they tell." },
            ];

            const categories = ["All", "Landscape", "Portrait", "Wildlife"];
            const filteredGallery = filter === "All" ? gallery : gallery.filter(img => img.cat === filter);
            const selectedImg = gallery.find(img => img.id === selectedId);

            return (
                <div className="min-h-screen selection:bg-white selection:text-black">
                    {/* Navigation - Ultra Minimalist */}
                    <nav className={`fixed top-0 w-full z-50 p-6 md:p-10 flex justify-between items-center transition-all duration-500 ${scrolled ? 'bg-black/80 backdrop-blur-md py-4' : 'bg-transparent'}`}>
                        <div className="text-xl tracking-[0.4em] font-light">ITSLEO.ISO</div>
                        <div className="flex gap-8 items-center text-[10px] tracking-widest uppercase">
                            <a href="#work" className="opacity-60 hover:opacity-100 transition-opacity hidden md:block">Gallery</a>
                            <a href="#about" className="opacity-60 hover:opacity-100 transition-opacity hidden md:block">The Eye</a>
                            <a href="https://www.instagram.com/itsleo.iso/" target="_blank" className="opacity-60 hover:opacity-100 transition-opacity flex items-center gap-2">
                                <IconInstagram /> <span className="hidden sm:inline">Follow</span>
                            </a>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="h-screen w-full relative overflow-hidden flex items-center justify-center bg-black">
                        <img 
                            src="https://images.unsplash.com/photo-1452587925148-ce544e77e70d?q=80&w=2400&auto=format&fit=crop" 
                            className="absolute inset-0 w-full h-full object-cover opacity-50 scale-105"
                            alt="Background"
                        />
                        <div className="relative z-10 text-center px-6">
                            <h1 className="text-6xl md:text-[10rem] font-light tracking-tighter mb-4 fade-in leading-none">
                                Cinematic <span className="italic font-serif">Aura</span>
                            </h1>
                            <p className="font-serif text-xl md:text-3xl italic opacity-70 fade-in" style={{animationDelay: '0.4s'}}>
                                Isolated moments in the Swiss landscape.
                            </p>
                        </div>
                        <div className="absolute bottom-12 left-1/2 -translate-x-1/2 text-[10px] tracking-[0.4em] opacity-30 uppercase">
                            Scroll to enter
                        </div>
                    </header>

                    {/* Filter Navigation */}
                    <section id="work" className="pt-40 pb-16 px-8 text-center">
                        <div className="flex flex-wrap justify-center gap-8 md:gap-16 text-[11px] tracking-[0.3em] uppercase opacity-50">
                            {categories.map(c => (
                                <button 
                                    key={c} 
                                    onClick={() => setFilter(c)}
                                    className={`hover:text-white transition-all relative pb-2 ${filter === c ? 'text-white opacity-100' : ''}`}
                                >
                                    {c}
                                    {filter === c && <div className="absolute bottom-0 left-0 w-full h-px bg-white animate-in slide-in-from-left duration-500"></div>}
                                </button>
                            ))}
                        </div>
                    </section>

                    {/* Gallery Grid */}
                    <main className="px-6 md:px-20 pb-40">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 md:gap-20">
                            {filteredGallery.map(img => (
                                <div 
                                    key={img.id} 
                                    className="img-container group"
                                    onClick={() => setSelectedId(img.id)}
                                >
                                    <div className="aspect-[3/4] overflow-hidden bg-zinc-900/50 relative">
                                        <img 
                                            src={img.src} 
                                            alt={img.title}
                                            className="w-full h-full object-cover transition-transform duration-1000 grayscale-[0.2] group-hover:grayscale-0" 
                                            loading="lazy"
                                        />
                                        <div className="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors duration-500"></div>
                                    </div>
                                    <div className="mt-6 flex justify-between items-baseline">
                                        <h3 className="text-sm font-light tracking-widest uppercase opacity-90">{img.title}</h3>
                                        <span className="text-[9px] tracking-widest opacity-30 uppercase italic">{img.cat}</span>
                                    </div>
                                    <p className="mt-2 font-serif italic text-sm text-white/40 leading-relaxed max-w-[90%]">
                                        {img.intent}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* About Section - Artistic focus */}
                    <section id="about" className="py-60 bg-[#f9f9f9] text-black px-8">
                        <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-20 items-center">
                            <div className="aspect-[4/5] bg-zinc-200 overflow-hidden grayscale">
                                <img 
                                    src="Aura_Portrait.jpg" 
                                    className="w-full h-full object-cover"
                                    alt="Leo"
                                />
                            </div>
                            <div className="text-left">
                                <h2 className="text-5xl md:text-7xl font-light mb-8 tracking-tighter">The Eye</h2>
                                <p className="font-serif text-xl italic mb-6 leading-relaxed opacity-80">
                                    "I am drawn to the stillness between the peaks of the Swiss Alps. My work isn't about the spectacle of nature, but the quiet, often overlooked shadows that give light its meaning."
                                </p>
                                <p className="text-sm tracking-wide leading-relaxed opacity-60">
                                    Based in the heart of Switzerland, I focus on cinematic atmosphere and visual storytelling. Each piece is an attempt to capture the 'ISO' of the moment—the specific grain and feeling of a memory.
                                </p>
                                <div className="mt-12">
                                    <a href="mailto:itsleo.iso.contact@gmail.com" className="text-xs tracking-[0.3em] uppercase border-b border-black pb-2 hover:opacity-50 transition-opacity font-bold">Work with me</a>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer / Contact */}
                    <footer className="py-32 px-8 text-center">
                        <div className="mb-20">
                            <h4 className="text-[10px] tracking-[0.5em] uppercase opacity-40 mb-10 font-bold">Connections</h4>
                            <div className="flex justify-center gap-12 text-sm tracking-widest">
                                <a href="https://www.instagram.com/itsleo.iso/" target="_blank" className="hover:opacity-50 transition-opacity">Instagram</a>
                                <a href="mailto:itsleo.iso.contact@gmail.com" className="hover:opacity-50 transition-opacity">Email</a>
                            </div>
                        </div>
                        <div className="h-px w-20 bg-white/10 mx-auto mb-20"></div>
                        <div className="text-[10px] tracking-[0.4em] opacity-30 uppercase">
                            Switzerland &nbsp; // &nbsp; Established MMXXV
                        </div>
                    </footer>

                    {/* Lightbox */}
                    {selectedId && (
                        <div className="fixed inset-0 z-[100] lightbox-overlay flex items-center justify-center p-4 md:p-16 animate-in fade-in duration-500">
                            <button 
                                onClick={() => setSelectedId(null)}
                                className="absolute top-10 right-10 text-white/50 hover:text-white transition-colors"
                            >
                                <IconClose />
                            </button>
                            
                            <div className="max-w-7xl w-full h-full flex flex-col items-center justify-center">
                                <div className="relative group max-h-[80vh]">
                                    <img 
                                        src={selectedImg.src} 
                                        className="max-w-full max-h-[80vh] object-contain shadow-2xl"
                                    />
                                    {/* Right-click message or invisible overlay */}
                                    <div className="absolute inset-0" onContextMenu={(e) => e.preventDefault()}></div>
                                </div>
                                <div className="mt-12 text-center max-w-xl">
                                    <h4 className="text-3xl font-light mb-4 tracking-tight">{selectedImg.title}</h4>
                                    <p className="font-serif italic text-lg text-white/60">
                                        {selectedImg.intent}
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
