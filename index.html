<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSLEO.ISO | Cinematic Photography</title>
    
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400&display=swap');
        
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            /* Simple deterrent for image theft */
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        h1, h2, h3, .font-serif {
            font-family: 'Cormorant Garamond', serif;
        }

        .img-container {
            cursor: zoom-in;
            transition: opacity 0.6s ease;
            position: relative;
        }

        /* Prevent dragging images */
        img {
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .img-container:hover img {
            transform: scale(1.03);
        }

        .lightbox-overlay {
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(15px);
        }

        /* Hide scrollbar but keep functionality */
        ::-webkit-scrollbar { display: none; }
        html { scroll-behavior: smooth; }

        .fade-in {
            animation: fadeIn 1.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Select Styling */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconClose = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2"><path d="M18 6L6 18M6 6l12 12"/></svg>;
        const IconInstagram = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>;

        const App = () => {
            const [lang, setLang] = useState("en");
            const [selectedId, setSelectedId] = useState(null);
            const [filter, setFilter] = useState("All");
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // YOUR ORIGINAL ARRAY (Untouched)
            const gallery = [
                { id: 1, cat: "Wildlife", src: "Gatto_Nero.JPG", title: "Feline Shadows", intent: "The silence of a hunter. Captured in the low Swiss sun to emphasize the depth of the blacks." },
                { id: 2, cat: "Landscape", src: "Quella_Suprema.jpg", title: "Alpine Motion", intent: "A meditation on the permanence of mountains versus the transience of clouds." },
                { id: 3, cat: "Portrait", src: "Gnocha_Ginger_Su_Moto.jpg", title: "Vagabond", intent: "Natural light study. Looking for the raw narrative between subject and machine." },
                { id: 4, cat: "Wildlife", src: "Uccelin.JPG", title: "Isolation", intent: "One small life against the vastness of the Swiss winter." },
                { id: 5, cat: "Landscape", src: "Fiume.jpg", title: "Blue Hour", intent: "The river as a mirror. Long exposure used to turn water into silk." },
                { id: 6, cat: "Landscape", src: "Acqua_nuvola.jpg", title: "Mist", intent: "High-key landscape exploring the boundary where water becomes sky." },
                { id: 7, cat: "Landscape", src: "Blessed_ahh.jpg", title: "Light Rays", intent: "Chasing the 'God Rays' through a forest canopy near Zurich." },
                { id: 8, cat: "Landscape", src: "Piccolo_farm_Spotv.2.jpg", title: "Pastoral", intent: "Geometric patterns in agriculture, showcasing the organized beauty of our hills." },
                { id: 9, cat: "Portrait", src: "Moto_cicco.jpg", title: "Mechanic", intent: "Close-up textural study. Chrome, oil, and the stories they tell." },
            ];

            // Translation Dictionary (Maps to English strings and Array IDs)
            const i18n = {
                en: {
                    nav: { gallery: "Gallery", eye: "The Eye", follow: "Follow" },
                    hero: { title: "Cinematic", titleSpan: "Aura", subtitle: "Isolated moments in the Swiss landscape.", scroll: "Scroll to enter" },
                    cat: { "All": "All", "Landscape": "Landscape", "Portrait": "Portrait", "Wildlife": "Wildlife" },
                    about: { title: "The Eye", quote: "\"I am drawn to the stillness between the peaks of the Swiss Alps. My work isn't about the spectacle of nature, but the quiet, often overlooked shadows that give light its meaning.\"", desc: "Based in the heart of Switzerland, I focus on cinematic atmosphere and visual storytelling. Each piece is an attempt to capture the 'ISO' of the moment—the specific grain and feeling of a memory.", work: "Work with me" },
                    footer: { connections: "Connections", established: "Switzerland  //  Established MMXXV" }
                },
                de: {
                    nav: { gallery: "Galerie", eye: "Das Auge", follow: "Folgen" },
                    hero: { title: "Zinematische", titleSpan: "Aura", subtitle: "Isolierte Momente in der Schweizer Landschaft.", scroll: "Scrollen zum Eintreten" },
                    cat: { "All": "Alle", "Landscape": "Landschaft", "Portrait": "Porträt", "Wildlife": "Natur" },
                    about: { title: "Das Auge", quote: "\"Mich zieht die Stille zwischen den Gipfeln der Schweizer Alpen an. Bei meiner Arbeit geht es nicht um das Spektakel der Natur, sondern um die leisen, oft übersehenen Schatten, die dem Licht seine Bedeutung verleihen.\"", desc: "Im Herzen der Schweiz beheimatet, konzentriere ich mich auf filmische Atmosphäre und visuelles Storytelling. Jedes Bild ist ein Versuch, das 'ISO' des Augenblicks einzufangen – die spezifische Körnung und das Gefühl einer Erinnerung.", work: "Zusammenarbeiten" },
                    footer: { connections: "Verbindungen", established: "Schweiz  //  Gegründet MMXXV" },
                    gallery: {
                        1: { title: "Feline Schatten", intent: "Die Stille eines Jägers. Eingefangen in der tief stehenden Schweizer Sonne, um die Tiefe des Schwarz zu betonen." },
                        2: { title: "Alpine Bewegung", intent: "Eine Meditation über die Beständigkeit der Berge gegenüber der Vergänglichkeit der Wolken." },
                        3: { title: "Vagabund", intent: "Studie mit natürlichem Licht. Auf der Suche nach der rohen Erzählung zwischen Subjekt und Maschine." },
                        4: { title: "Isolation", intent: "Ein kleines Leben gegen die Weite des Schweizer Winters." },
                        5: { title: "Blaue Stunde", intent: "Der Fluss als Spiegel. Langzeitbelichtung, um Wasser in Seide zu verwandeln." },
                        6: { title: "Nebel", intent: "High-Key-Landschaft, die die Grenze erkundet, an der Wasser zu Himmel wird." },
                        7: { title: "Lichtstrahlen", intent: "Auf der Jagd nach den 'God Rays' durch ein Blätterdach in der Nähe von Zürich." },
                        8: { title: "Pastoral", intent: "Geometrische Muster in der Landwirtschaft, die die organisierte Schönheit unserer Hügel zeigen." },
                        9: { title: "Mechaniker", intent: "Strukturelle Nahaufnahme. Chrom, Öl und die Geschichten, die sie erzählen." }
                    }
                },
                it: {
                    nav: { gallery: "Galleria", eye: "L'Occhio", follow: "Segui" },
                    hero: { title: "Aura", titleSpan: "Cinematografica", subtitle: "Momenti isolati nel paesaggio svizzero.", scroll: "Scorri per entrare" },
                    cat: { "All": "Tutti", "Landscape": "Paesaggio", "Portrait": "Ritratto", "Wildlife": "Natura" },
                    about: { title: "L'Occhio", quote: "\"Sono attratto dalla quiete tra le vette delle Alpi svizzere. Il mio lavoro non riguarda lo spettacolo della natura, ma le ombre silenziose e spesso trascurate che danno senso alla luce.\"", desc: "Con base nel cuore della Svizzera, mi concentro sull'atmosfera cinematografica e sulla narrazione visiva. Ogni opera è un tentativo di catturare l' 'ISO' del momento—la grana specifica e il sentimento di un ricordo.", work: "Lavora con me" },
                    footer: { connections: "Connessioni", established: "Svizzera  //  Fondata MMXXV" },
                    gallery: {
                        1: { title: "Ombre Feline", intent: "Il silenzio di un cacciatore. Catturato sotto il basso sole svizzero per enfatizzare la profondità dei neri." },
                        2: { title: "Movimento Alpino", intent: "Una meditazione sulla permanenza delle montagne contro la caducità delle nuvole." },
                        3: { title: "Vagabondo", intent: "Studio di luce naturale. Alla ricerca della narrazione cruda tra soggetto e macchina." },
                        4: { title: "Isolamento", intent: "Una piccola vita contro la vastità dell'inverno svizzero." },
                        5: { title: "Ora Blu", intent: "Il fiume come specchio. Lunga esposizione usata per trasformare l'acqua in seta." },
                        6: { title: "Nebbia", intent: "Paesaggio high-key che esplora il confine in cui l'acqua diventa cielo." },
                        7: { title: "Raggi di Luce", intent: "A caccia dei 'Raggi di Dio' attraverso la chioma di una foresta vicino a Zurigo." },
                        8: { title: "Pastorale", intent: "Motivi geometrici nell'agricoltura, che mostrano la bellezza organizzata delle nostre colline." },
                        9: { title: "Meccanico", intent: "Studio testurale ravvicinato. Cromo, olio e le storie che raccontano." }
                    }
                }
            };

            const categories = ["All", "Landscape", "Portrait", "Wildlife"];
            const filteredGallery = filter === "All" ? gallery : gallery.filter(img => img.cat === filter);
            const selectedImg = gallery.find(img => img.id === selectedId);

            const t = i18n[lang]; // Active translations

            // Helper function to get translated gallery text
            const getGalleryText = (id, key, fallback) => {
                if (lang === "en") return fallback;
                return t.gallery[id][key];
            };

            return (
                <div className="min-h-screen selection:bg-white selection:text-black">
                    {/* Navigation - Ultra Minimalist */}
                    <nav className={`fixed top-0 w-full z-50 p-6 md:p-10 flex justify-between items-center transition-all duration-500 ${scrolled ? 'bg-black/80 backdrop-blur-md py-4' : 'bg-transparent'}`}>
                        <div className="text-xl tracking-[0.4em] font-light">ITSLEO.ISO</div>
                        <div className="flex gap-6 md:gap-8 items-center text-[10px] tracking-widest uppercase">
                            
                            {/* Language Selector */}
                            <select 
                                value={lang} 
                                onChange={(e) => setLang(e.target.value)}
                                className="bg-transparent text-white outline-none cursor-pointer opacity-60 hover:opacity-100 transition-opacity font-bold uppercase"
                            >
                                <option value="en" className="bg-black text-white">EN</option>
                                <option value="de" className="bg-black text-white">DE</option>
                                <option value="it" className="bg-black text-white">IT</option>
                            </select>

                            <a href="#work" className="opacity-60 hover:opacity-100 transition-opacity hidden md:block">{t.nav.gallery}</a>
                            <a href="#about" className="opacity-60 hover:opacity-100 transition-opacity hidden md:block">{t.nav.eye}</a>
                            <a href="https://www.instagram.com/itsleo.iso/" target="_blank" className="opacity-60 hover:opacity-100 transition-opacity flex items-center gap-2">
                                <IconInstagram /> <span className="hidden sm:inline">{t.nav.follow}</span>
                            </a>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="h-screen w-full relative overflow-hidden flex items-center justify-center bg-black">
                        <img 
                            src="https://images.unsplash.com/photo-1452587925148-ce544e77e70d?q=80&w=2400&auto=format&fit=crop" 
                            className="absolute inset-0 w-full h-full object-cover opacity-50 scale-105"
                            alt="Background"
                        />
                        <div className="relative z-10 text-center px-6">
                            <h1 className="text-5xl md:text-[10rem] font-light tracking-tighter mb-4 fade-in leading-none">
                                {t.hero.title} <span className="italic font-serif">{t.hero.titleSpan}</span>
                            </h1>
                            <p className="font-serif text-xl md:text-3xl italic opacity-70 fade-in" style={{animationDelay: '0.4s'}}>
                                {t.hero.subtitle}
                            </p>
                        </div>
                        <div className="absolute bottom-12 left-1/2 -translate-x-1/2 text-[10px] tracking-[0.4em] opacity-30 uppercase whitespace-nowrap">
                            {t.hero.scroll}
                        </div>
                    </header>

                    {/* Filter Navigation */}
                    <section id="work" className="pt-40 pb-16 px-8 text-center">
                        <div className="flex flex-wrap justify-center gap-8 md:gap-16 text-[11px] tracking-[0.3em] uppercase opacity-50">
                            {categories.map(c => (
                                <button 
                                    key={c} 
                                    onClick={() => setFilter(c)}
                                    className={`hover:text-white transition-all relative pb-2 ${filter === c ? 'text-white opacity-100' : ''}`}
                                >
                                    {t.cat[c]}
                                    {filter === c && <div className="absolute bottom-0 left-0 w-full h-px bg-white animate-in slide-in-from-left duration-500"></div>}
                                </button>
                            ))}
                        </div>
                    </section>

                    {/* Gallery Grid */}
                    <main className="px-6 md:px-20 pb-40">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 md:gap-20">
                            {filteredGallery.map(img => (
                                <div 
                                    key={img.id} 
                                    className="img-container group"
                                    onClick={() => setSelectedId(img.id)}
                                >
                                    <div className="aspect-[3/4] overflow-hidden bg-zinc-900/50 relative">
                                        <img 
                                            src={img.src} 
                                            alt={getGalleryText(img.id, 'title', img.title)}
                                            className="w-full h-full object-cover transition-transform duration-1000 grayscale-[0.2] group-hover:grayscale-0" 
                                            loading="lazy"
                                        />
                                        <div className="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors duration-500"></div>
                                    </div>
                                    <div className="mt-6 flex justify-between items-baseline">
                                        <h3 className="text-sm font-light tracking-widest uppercase opacity-90">
                                            {getGalleryText(img.id, 'title', img.title)}
                                        </h3>
                                        <span className="text-[9px] tracking-widest opacity-30 uppercase italic">
                                            {t.cat[img.cat]}
                                        </span>
                                    </div>
                                    <p className="mt-2 font-serif italic text-sm text-white/40 leading-relaxed max-w-[90%]">
                                        {getGalleryText(img.id, 'intent', img.intent)}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* About Section */}
                    <section id="about" className="py-60 bg-[#f9f9f9] text-black px-8">
                        <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-20 items-center">
                            <div className="aspect-[4/5] bg-zinc-200 overflow-hidden grayscale">
                                <img 
                                    src="Aura_Portrait.jpg" 
                                    className="w-full h-full object-cover"
                                    alt="Leo"
                                />
                            </div>
                            <div className="text-left">
                                <h2 className="text-5xl md:text-7xl font-light mb-8 tracking-tighter">{t.about.title}</h2>
                                <p className="font-serif text-xl italic mb-6 leading-relaxed opacity-80">
                                    {t.about.quote}
                                </p>
                                <p className="text-sm tracking-wide leading-relaxed opacity-60">
                                    {t.about.desc}
                                </p>
                                <div className="mt-12">
                                    <a href="mailto:itsleo.iso.contact@gmail.com" className="text-xs tracking-[0.3em] uppercase border-b border-black pb-2 hover:opacity-50 transition-opacity font-bold">{t.about.work}</a>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer / Contact */}
                    <footer className="py-32 px-8 text-center">
                        <div className="mb-20">
                            <h4 className="text-[10px] tracking-[0.5em] uppercase opacity-40 mb-10 font-bold">{t.footer.connections}</h4>
                            <div className="flex justify-center gap-12 text-sm tracking-widest">
                                <a href="https://www.instagram.com/itsleo.iso/" target="_blank" className="hover:opacity-50 transition-opacity">Instagram</a>
                                <a href="mailto:itsleo.iso.contact@gmail.com" className="hover:opacity-50 transition-opacity">Email</a>
                            </div>
                        </div>
                        <div className="h-px w-20 bg-white/10 mx-auto mb-20"></div>
                        <div className="text-[10px] tracking-[0.4em] opacity-30 uppercase">
                            {t.footer.established}
                        </div>
                    </footer>

                    {/* Lightbox */}
                    {selectedId && (
                        <div className="fixed inset-0 z-[100] lightbox-overlay flex items-center justify-center p-4 md:p-16 animate-in fade-in duration-500">
                            <button 
                                onClick={() => setSelectedId(null)}
                                className="absolute top-10 right-10 text-white/50 hover:text-white transition-colors"
                            >
                                <IconClose />
                            </button>
                            
                            <div className="max-w-7xl w-full h-full flex flex-col items-center justify-center">
                                <div className="relative group max-h-[80vh]">
                                    <img 
                                        src={selectedImg.src} 
                                        className="max-w-full max-h-[80vh] object-contain shadow-2xl"
                                    />
                                    {/* Right-click message or invisible overlay */}
                                    <div className="absolute inset-0" onContextMenu={(e) => e.preventDefault()}></div>
                                </div>
                                <div className="mt-12 text-center max-w-xl">
                                    <h4 className="text-3xl font-light mb-4 tracking-tight">
                                        {getGalleryText(selectedImg.id, 'title', selectedImg.title)}
                                    </h4>
                                    <p className="font-serif italic text-lg text-white/60">
                                        {getGalleryText(selectedImg.id, 'intent', selectedImg.intent)}
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
