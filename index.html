<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio - Concept</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #0c0c0c;
            --text-color: #999999;
            --highlight-bg: #d34a24;
            --highlight-text: #ffffff;
            --card-bg: #1a1a1a;
            --finder-bg: #161616;
            --finder-accent: #007aff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 30px 30px;
            -webkit-user-select: none;
            user-select: none;
        }

        /* View Switching Logic */
        .app-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .view-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            display: flex;
            align-items: center;
        }

        .main-view { transform: translateX(0); opacity: 1; z-index: 10; }
        .projects-view { transform: translateX(100%); opacity: 0; z-index: 5; }

        .is-projects-active .main-view { transform: translateX(-100%); opacity: 0; }
        .is-projects-active .projects-view { transform: translateX(0); opacity: 1; z-index: 10; }

        .list-container {
            padding-left: 60px;
            width: 450px;
            flex-shrink: 0;
        }

        .nav-item {
            display: block;
            width: fit-content;
            font-size: 3.5rem;
            font-weight: 800;
            padding: 0.2rem 1.5rem;
            margin: 0.2rem 0;
            cursor: pointer;
            transition: all 0.2s ease-out;
            border-radius: 4px;
        }

        .nav-item:hover {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            transform: scale(1.05) translateX(10px);
        }

        .finder-window {
            margin-left: 60px;
            width: 80%;
            height: 70vh;
            background: var(--finder-bg);
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.7);
        }

        .finder-col {
            flex: 1;
            border-right: 1px solid #222;
            padding: 10px 0;
            overflow-y: auto;
        }

        .finder-item {
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #bbb;
        }

        .finder-item:hover { background: rgba(255,255,255,0.05); }
        .finder-item.active { background: var(--finder-accent); color: white; }

        .back-nav {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
            z-index: 100;
        }
        .back-nav:hover { opacity: 1; }

        #content-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* About Layout Styling */
        .about-container {
            display: grid;
            grid-template-columns: 350px 250px;
            gap: 20px;
            padding: 30px;
            border-radius: 4px;
        }

        .about-block {
            background-color: #d34a24;
            color: black;
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-radius: 2px;
        }

        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="app-viewport" id="viewport">
        
        <!-- MAIN NAVIGATION LAYER -->
        <div class="view-layer main-view">
            <div class="list-container">
                <div class="nav-item" onclick="switchMainTab('home')">#Home</div>
                <div class="nav-item" onclick="switchMainTab('about')">#About</div>
                <div class="nav-item" onclick="openProjects()">#Projects</div>
                <div class="nav-item" onclick="switchMainTab('contact')">#Contact</div>
            </div>

            <div id="content-area">
                <div class="flex flex-col items-center">
                    <div class="text-[12rem] font-black leading-none opacity-10 select-none">Hi!</div>
                    <div class="text-2xl font-light tracking-widest opacity-30 mt-4 uppercase italic">Welcome to my portfolio! Hope you enjoy!</div>
                </div>
            </div>
        </div>

        <!-- PROJECTS FINDER LAYER -->
        <div class="view-layer projects-view">
            <div class="back-nav" onclick="closeProjects()"># <=</div>
            
            <div class="finder-window">
                <div class="finder-column finder-col" id="folder-list">
                    <div class="finder-item active" onclick="loadProjectDir('Landscape', this)">
                        <svg width="18" height="14" viewBox="0 0 24 24" fill="currentColor" class="text-blue-500"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                        Landscape
                    </div>
                    <div class="finder-item" onclick="loadProjectDir('Portrait', this)">
                        <svg width="18" height="14" viewBox="0 0 24 24" fill="currentColor" class="text-blue-500"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                        Portrait
                    </div>
                    <div class="finder-item" onclick="loadProjectDir('Wildlife', this)">
                        <svg width="18" height="14" viewBox="0 0 24 24" fill="currentColor" class="text-blue-500"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                        Wildlife
                    </div>
                </div>

                <div class="finder-column finder-col bg-black/10" id="file-list"></div>

                <div class="finder-column finder-col bg-black/20 flex flex-col items-center justify-center p-8 text-center" id="file-preview">
                    <div class="w-24 h-24 bg-white/5 rounded-xl mb-4 flex items-center justify-center">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="opacity-20"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                    </div>
                    <p class="text-xs opacity-30">Selection Preview</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const contentArea = document.getElementById('content-area');
        const fileList = document.getElementById('file-list');
        const filePreview = document.getElementById('file-preview');

        const gallery = [
            { id: 1, cat: "Wildlife", src: "Gatto_Nero.JPG", title: "Feline Shadows", intent: "The silence of a hunter. Captured in the low Swiss sun to emphasize the depth of the blacks." },
            { id: 2, cat: "Landscape", src: "Quella_Suprema.jpg", title: "Alpine Motion", intent: "A meditation on the permanence of mountains versus the transience of clouds." },
            { id: 3, cat: "Portrait", src: "Gnocha_Ginger_Su_Moto.jpg", title: "Vagabond", intent: "Natural light study. Looking for the raw narrative between subject and machine." },
            { id: 4, cat: "Wildlife", src: "Uccelin.JPG", title: "Isolation", intent: "One small life against the vastness of the Swiss winter." },
            { id: 5, cat: "Landscape", src: "Fiume.jpg", title: "Blue Hour", intent: "The river as a mirror. Long exposure used to turn water into silk." },
            { id: 6, cat: "Landscape", src: "Acqua_nuvola.jpg", title: "Mist", intent: "High-key landscape exploring the boundary where water becomes sky." },
            { id: 7, cat: "Landscape", src: "Blessed_ahh.jpg", title: "Light Rays", intent: "Chasing the 'God Rays' through a forest canopy near Zurich." },
            { id: 8, cat: "Landscape", src: "Piccolo_farm_Spotv.2.jpg", title: "Pastoral", intent: "Geometric patterns in agriculture, showcasing the organized beauty of our hills." },
            { id: 9, cat: "Portrait", src: "Moto_cicco.jpg", title: "Mechanic", intent: "Close-up textural study. Chrome, oil, and the stories they tell." }
        ];

        function switchMainTab(tab) {
            if(tab === 'about') {
                contentArea.innerHTML = `
                    <div class="about-container fade-in">
                        <!-- Left Block: About text -->
                        <div class="about-block h-[500px]">
                            <h2 class="text-3xl font-black mb-4 uppercase tracking-tighter italic">About Text</h2>
                            <p class="text-sm font-medium leading-relaxed">
                                I am a 16-year-old photographer based in Switzerland. My work focuses on capturing the raw beauty of the Swiss landscape, the character of its wildlife, and the unique stories found in portraits.
                            </p>
                            <p class="text-sm font-medium leading-relaxed mt-4 opacity-80">
                                Using the interplay of light and shadow, I strive to create "ISO moments"—stills that feel isolated from time and filled with narrative intent.
                            </p>
                        </div>
                        
                        <!-- Right Column: Picture + Icon -->
                        <div class="flex flex-col gap-[20px]">
                            <div class="about-block h-[240px] items-center justify-center overflow-hidden relative">
                                <!-- Updated this part to show your portrait -->
                                <img src="portrait.jpg" class="absolute inset-0 w-full h-full object-cover opacity-90" onerror="this.style.display='none'">
                                <div class="w-20 h-20 rounded-full bg-black/20 flex items-center justify-center border border-black/10 relative z-10">
                                     <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="opacity-30"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </div>
                                <span class="text-[10px] uppercase font-bold tracking-widest opacity-40 mt-2 z-10">Self Portrait</span>
                            </div>
                            <div class="about-block h-[240px] items-center justify-center text-center">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="mb-3 opacity-60"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                <span class="text-[10px] uppercase font-bold tracking-widest opacity-40">Main Setup</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tab === 'home') {
                contentArea.innerHTML = `
                    <div class="flex flex-col items-center">
                        <div class="text-[12rem] font-black leading-none opacity-10 select-none">Hi!</div>
                        <div class="text-2xl font-light tracking-widest opacity-30 mt-4 uppercase italic">Welcome to my portfolio</div>
                    </div>
                `;
            } else if (tab === 'contact') {
                contentArea.innerHTML = `
                    <div class="flex flex-col items-center text-center">
                        <div class="text-[8rem] font-black leading-none opacity-10 select-none mb-8">Contact Me!</div>
                        <div class="flex items-center gap-4 mb-2">
                            <span class="text-4xl font-bold tracking-tighter text-white/60 italic">ItsLeo.ISO</span>
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="opacity-40"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                        </div>
                        <div class="text-lg font-light tracking-widest opacity-30 lowercase">example@gmail.com</div>
                    </div>
                `;
            } else {
                contentArea.innerHTML = `<div class="text-9xl font-black opacity-10 uppercase select-none">${tab}</div>`;
            }
        }

        function openProjects() {
            viewport.classList.add('is-projects-active');
        }

        function closeProjects() {
            viewport.classList.remove('is-projects-active');
        }

        function loadProjectDir(category, el) {
            document.querySelectorAll('#folder-list .finder-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');

            const filtered = gallery.filter(item => item.cat === category);
            fileList.innerHTML = filtered.map(item => `
                <div class="finder-item" onclick="previewFile(${item.id})">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="opacity-40"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
                    ${item.src}
                </div>
            `).join('');

            filePreview.innerHTML = `
                <div class="w-24 h-24 bg-white/5 rounded-xl mb-4 flex items-center justify-center">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="opacity-20"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                </div>
                <p class="text-xs opacity-30">Category: ${category}</p>
            `;
        }

        function previewFile(id) {
            const item = gallery.find(g => g.id === id);
            if(!item) return;

            document.querySelectorAll('#file-list .finder-item').forEach(i => {
                if(i.innerText.trim() === item.src) i.classList.add('active');
                else i.classList.remove('active');
            });

            filePreview.innerHTML = `
                <div class="w-full h-48 bg-white/5 rounded-lg mb-6 flex items-center justify-center overflow-hidden">
                    <img src="${item.src}" class="max-w-full max-h-full object-contain opacity-70" onerror="this.parentElement.innerHTML='<span class=opacity-20>File: ${item.src}</span>'">
                </div>
                <h4 class="text-white text-sm font-bold mb-1">${item.title}</h4>
                <p class="text-[10px] opacity-40 uppercase tracking-widest mb-4 italic">${item.cat} Session</p>
                <div class="px-6 py-4 bg-white/5 rounded-lg text-left mb-6">
                    <p class="text-[11px] leading-relaxed opacity-60">${item.intent}</p>
                </div>
                <button class="px-5 py-2 border border-white/10 rounded text-[10px] hover:bg-white hover:text-black transition-all">VIEW FULL RESOLUTION</button>
            `;
        }

        window.onload = () => {
             loadProjectDir('Landscape', document.querySelector('#folder-list .finder-item'));
        };
    </script>
</body>
</html>
