<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio - Concept</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons for high quality visuals -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0c0c0c;
            --text-color: #444444; /* Darker unselected color */
            --highlight-bg: #d34a24;
            --highlight-text: #ffffff;
            --card-bg: #1a1a1a;
            --finder-bg: #161616;
            --finder-accent: #007aff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 30px 30px;
            -webkit-user-select: none;
            user-select: none;
        }

        /* --- DEVICE CHOOSER (MM2 STYLE) --- */
        #device-chooser {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 30px 30px;
            transition: opacity 0.8s ease;
        }

        .chooser-header {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .cards-container {
            display: flex;
            gap: 24px;
            position: relative;
            transition: all 0.5s ease;
        }

        .chooser-card {
            width: 260px;
            height: 160px;
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .chooser-card:hover {
            border-color: var(--highlight-bg);
            background: #151515;
            transform: scale(1.05);
        }

        .chooser-card span {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 800;
            margin-top: 15px;
            color: #555;
            transition: color 0.3s;
        }

        .chooser-card:hover span {
            color: white;
        }

        .card-selected {
            z-index: 100;
            border-color: var(--highlight-bg) !important;
            box-shadow: 0 0 60px rgba(211, 74, 36, 0.2);
        }

        .card-discarded {
            opacity: 0;
            transform: translateY(100px) scale(0.8) !important;
            pointer-events: none;
        }

        /* --- MOBILE LAYOUT --- */
        #mobile-layout {
            display: none;
            height: 100vh;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-color);
            -webkit-overflow-scrolling: touch;
        }

        .mobile-nav-btn {
            background: #111;
            border: 1px solid #222;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: white;
        }

        .mobile-card {
            background: #111;
            border-radius: 12px;
            border: 1px solid #222;
            padding: 15px;
            margin-bottom: 15px;
        }

        /* --- DESKTOP LAYOUT --- */
        #desktop-layout {
            display: none;
            height: 100vh;
        }

        .app-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .view-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            display: flex;
            align-items: center;
        }

        .main-view { transform: translateX(0); opacity: 1; z-index: 10; }
        .projects-view { transform: translateX(100%); opacity: 0; z-index: 5; }

        .is-projects-active .main-view { transform: translateX(-100%); opacity: 0; }
        .is-projects-active .projects-view { transform: translateX(0); opacity: 1; z-index: 10; }

        /* --- ORGANIC NAVIGATION --- */
        .list-container {
            padding-left: 60px;
            width: 450px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            display: block;
            width: fit-content;
            font-size: 2.2rem; /* Smaller unselected size */
            font-weight: 800;
            padding: 0.2rem 1.2rem;
            color: var(--text-color);
            cursor: pointer;
            transition: 
                font-size 0.5s cubic-bezier(0.68, -0.6, 0.32, 1.6),
                color 0.3s ease,
                background-color 0.3s ease,
                transform 0.5s cubic-bezier(0.68, -0.6, 0.32, 1.6),
                box-shadow 0.4s ease;
            border-radius: 4px;
            transform-origin: left center;
        }

        /* Wobbly Hover State */
        .nav-item:hover:not(.active-tab) {
            color: #777;
            transform: scale(1.1) rotate(-1deg) translateX(5px);
        }

        /* Selected State - Wobbly and Alive */
        .nav-item.active-tab {
            font-size: 4rem; /* Significantly bigger */
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            transform: scale(1.05) translateX(20px) rotate(1deg);
            box-shadow: 0 15px 35px rgba(211, 74, 36, 0.3);
            z-index: 20;
        }

        /* Subtle wobbly floating animation loop for active tab */
        @keyframes organic-float {
            0% { transform: scale(1.05) translateX(20px) rotate(1.5deg); }
            50% { transform: scale(1.08) translateX(25px) rotate(-1deg); }
            100% { transform: scale(1.05) translateX(20px) rotate(1.5deg); }
        }

        .nav-item.active-tab {
            animation: organic-float 4s infinite ease-in-out;
        }

        .finder-window {
            margin-left: 60px;
            width: 80%;
            height: 70vh;
            background: var(--finder-bg);
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.7);
        }

        .finder-col {
            flex: 1;
            border-right: 1px solid #222;
            padding: 10px 0;
            overflow-y: auto;
        }

        .finder-item {
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #bbb;
        }

        .finder-item:hover { background: rgba(255,255,255,0.05); }
        .finder-item.active { background: var(--finder-accent); color: white; }

        .back-nav {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
            z-index: 100;
        }
        .back-nav:hover { opacity: 1; }

        #content-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* Overlay Styling */
        #image-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 6000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: zoom-out;
        }

        #image-overlay.active {
            display: flex;
            opacity: 1;
            align-items: center;
            justify-content: center;
        }

        .overlay-img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            transform: scale(0.9);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #image-overlay.active .overlay-img {
            transform: scale(1);
        }

        /* --- ABOUT PAGE AS PER SCREENSHOT --- */
        .about-layout {
            display: flex;
            gap: 20px;
            height: 500px;
        }

        .about-text-col {
            width: 320px;
            background: var(--highlight-bg);
            color: black;
            padding: 30px;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            /* Spring entrance animation */
            animation: spring-in 0.7s cubic-bezier(0.68, -0.6, 0.32, 1.6) forwards;
        }

        .about-stacked-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 250px;
        }

        .about-square {
            flex: 1;
            background: var(--highlight-bg);
            color: black;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            position: relative;
            /* Staggered spring entrance */
            opacity: 0;
            animation: spring-in 0.7s cubic-bezier(0.68, -0.6, 0.32, 1.6) forwards;
        }

        .about-square:nth-child(1) { animation-delay: 0.1s; }
        .about-square:nth-child(2) { animation-delay: 0.2s; }

        @keyframes spring-in {
            0% { opacity: 0; transform: scale(0.8) translateY(40px) rotate(-5deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- DEVICE CHOOSER (MM2) -->
    <div id="device-chooser">
        <div class="chooser-header text-center mb-10">
            <h1 class="text-white text-xs tracking-[0.5em] uppercase opacity-40 font-black">Choose your path</h1>
        </div>
        
        <div class="cards-container flex flex-col md:flex-row gap-6" id="chooser-cards">
            <div class="chooser-card" onclick="selectDevice('desktop', this)">
                <i data-lucide="monitor" class="w-8 h-8 text-white/20"></i>
                <span>Desktop Mode</span>
            </div>
            <div class="chooser-card" onclick="selectDevice('mobile', this)">
                <i data-lucide="smartphone" class="w-8 h-8 text-white/20"></i>
                <span>Mobile Mode</span>
            </div>
        </div>

        <p class="chooser-header text-[9px] text-white/20 uppercase tracking-widest mt-12 italic">Swiss Engineering x Minimalist Art</p>
    </div>

    <!-- DESKTOP LAYOUT -->
    <div id="desktop-layout">
        <div class="app-viewport" id="viewport">
            <div class="view-layer main-view">
                <div class="list-container">
                    <div class="nav-item active-tab" id="nav-home" onclick="switchMainTab('home')">#Home</div>
                    <div class="nav-item" id="nav-about" onclick="switchMainTab('about')">#About</div>
                    <div class="nav-item" id="nav-projects" onclick="openProjects()">#Projects</div>
                    <div class="nav-item" id="nav-contact" onclick="switchMainTab('contact')">#Contact</div>
                </div>
                <div id="content-area">
                    <div class="flex flex-col items-center fade-in">
                        <div class="text-[12rem] font-black leading-none opacity-10 select-none">Hi!</div>
                        <div class="text-2xl font-light tracking-widest opacity-30 mt-4 uppercase italic">Welcome to my portfolio</div>
                    </div>
                </div>
            </div>

            <div class="view-layer projects-view">
                <div class="back-nav" onclick="closeProjects()"># <=</div>
                <div class="finder-window">
                    <div class="finder-column finder-col" id="folder-list">
                        <div class="finder-item active" onclick="loadProjectDir('Landscape', this)">
                            <i data-lucide="folder" class="w-4 h-4 text-blue-500 fill-blue-500"></i>
                            Landscape
                        </div>
                        <div class="finder-item" onclick="loadProjectDir('Portrait', this)">
                            <i data-lucide="folder" class="w-4 h-4 text-blue-500 fill-blue-500"></i>
                            Portrait
                        </div>
                        <div class="finder-item" onclick="loadProjectDir('Wildlife', this)">
                            <i data-lucide="folder" class="w-4 h-4 text-blue-500 fill-blue-500"></i>
                            Wildlife
                        </div>
                    </div>
                    <div class="finder-column finder-col bg-black/10" id="file-list"></div>
                    <div class="finder-column finder-col bg-black/20 flex flex-col items-center justify-center p-8 text-center" id="file-preview">
                        <p class="text-xs opacity-30">Selection Preview</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MOBILE LAYOUT -->
    <div id="mobile-layout">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-4xl font-black italic text-white tracking-tighter">Leo.ISO</h1>
        </div>
        
        <div class="grid grid-cols-2 gap-3 mb-10">
            <button onclick="mobileSwitchTab('home')" class="mobile-nav-btn">Home</button>
            <button onclick="mobileSwitchTab('about')" class="mobile-nav-btn">About</button>
            <button onclick="mobileSwitchTab('projects')" class="mobile-nav-btn">Projects</button>
            <button onclick="mobileSwitchTab('contact')" class="mobile-nav-btn">Contact</button>
        </div>

        <div id="mobile-content-area" class="fade-in"></div>
    </div>

    <!-- NATIVE OVERLAY SYSTEM -->
    <div id="image-overlay" onclick="closeOverlay()">
        <img src="" id="overlay-img" class="overlay-img" onclick="event.stopPropagation()">
        <div class="absolute bottom-10 left-0 right-0 text-center text-white text-[10px] tracking-[0.3em] opacity-40 uppercase">Tap background to exit</div>
    </div>

    <script>
        // Initialize Lucide
        lucide.createIcons();

        const gallery = [
            { id: 1, cat: "Wildlife", src: "Gatto_Nero.JPG", title: "Feline Shadows", intent: "The silence of a hunter. Captured in the low Swiss sun." },
            { id: 2, cat: "Landscape", src: "Quella_Suprema.jpg", title: "Alpine Motion", intent: "A meditation on the permanence of mountains." },
            { id: 3, cat: "Portrait", src: "Gnocha_Ginger_Su_Moto.jpg", title: "Vagabond", intent: "Natural light study. Swiss narrative." },
            { id: 4, cat: "Wildlife", src: "Uccelin.JPG", title: "Isolation", intent: "One small life against the vastness of winter." },
            { id: 5, cat: "Landscape", src: "Fiume.jpg", title: "Blue Hour", intent: "The river as a mirror." },
            { id: 6, cat: "Landscape", src: "Acqua_nuvola.jpg", title: "Mist", intent: "High-key landscape exploring boundaries." },
            { id: 7, cat: "Landscape", src: "Blessed_ahh.jpg", title: "Light Rays", intent: "Chasing God Rays near Zurich." },
            { id: 8, cat: "Landscape", src: "Piccolo_farm_Spotv.2.jpg", title: "Pastoral", intent: "Geometric patterns in agriculture." },
            { id: 9, cat: "Portrait", src: "Moto_cicco.jpg", title: "Mechanic", intent: "Close-up textural study." }
        ];

        // --- DEVICE SELECTION LOGIC (MM2) ---
        function selectDevice(mode, el) {
            const chooser = document.getElementById('device-chooser');
            const headers = document.querySelectorAll('.chooser-header');
            const cards = document.querySelectorAll('.chooser-card');

            headers.forEach(h => { h.style.opacity = '0'; h.style.transform = 'translateY(-20px)'; });
            cards.forEach(card => {
                if (card === el) card.classList.add('card-selected');
                else card.classList.add('card-discarded');
            });

            const rect = el.getBoundingClientRect();
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const currentX = rect.left + rect.width / 2;
            const currentY = rect.top + rect.height / 2;

            el.style.transform = `translate(${centerX - currentX}px, ${centerY - currentY}px) scale(1.15)`;

            setTimeout(() => {
                chooser.style.opacity = '0';
                setTimeout(() => {
                    chooser.style.display = 'none';
                    if(mode === 'desktop') {
                        document.getElementById('desktop-layout').style.display = 'block';
                        loadProjectDir('Landscape', document.querySelector('#folder-list .finder-item'));
                    } else {
                        document.getElementById('mobile-layout').style.display = 'block';
                        mobileSwitchTab('home');
                    }
                }, 800);
            }, 800);
        }

        // --- DESKTOP LOGIC ---
        const viewport = document.getElementById('viewport');
        const contentArea = document.getElementById('content-area');
        const fileList = document.getElementById('file-list');
        const filePreview = document.getElementById('file-preview');

        function switchMainTab(tab) {
            // Organic UI handling
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active-tab'));
            const activeNav = document.getElementById('nav-' + tab);
            if(activeNav) activeNav.classList.add('active-tab');

            if(tab === 'about') {
                contentArea.innerHTML = `
                <div class="about-layout">
                    <div class="about-text-col">
                        <h2 class="text-4xl font-black italic mb-6">ABOUT</h2>
                        <p class="text-sm font-bold leading-relaxed mb-4">
                            My name is Leo, a 16-year-old photographer living in Switzerland. 
                        </p>
                        <p class="text-sm font-bold leading-relaxed">
                            I focus on the "ISO Lifestyle"—finding beauty in technical precision and raw lighting. Switzerland offers a landscape like no other, and my goal is to capture its geometry and soul.
                        </p>
                        <div class="mt-auto text-[10px] font-black uppercase tracking-[0.3em] opacity-40">Swiss Engineering x Art</div>
                    </div>
                    <div class="about-stacked-col">
                        <div class="about-square">
                            <i data-lucide="user" class="w-12 h-12 mb-2 opacity-50"></i>
                            <span class="text-[10px] font-black uppercase tracking-widest">Picture of me</span>
                        </div>
                        <div class="about-square">
                            <i data-lucide="camera" class="w-16 h-16 opacity-40"></i>
                            <span class="text-[10px] font-black uppercase tracking-widest mt-4">Leo.ISO</span>
                        </div>
                    </div>
                </div>`;
                lucide.createIcons();
            } else if (tab === 'home') {
                contentArea.innerHTML = `
                <div class="flex flex-col items-center fade-in">
                    <div class="text-[12rem] font-black leading-none opacity-10 select-none">Hi!</div>
                    <div class="text-2xl font-light tracking-widest opacity-30 mt-4 uppercase italic">Welcome to my portfolio</div>
                </div>`;
            } else if (tab === 'contact') {
                contentArea.innerHTML = `
                <div class="text-center fade-in">
                    <div class="text-[8rem] font-black opacity-10 leading-none">Contact</div>
                    <div class="flex flex-col items-center gap-6 mt-12">
                        <a href="https://instagram.com/leo.iso" target="_blank" class="flex items-center gap-4 text-white hover:text-[#d34a24] transition-colors group">
                            <i data-lucide="instagram" class="w-8 h-8 group-hover:scale-110 transition-transform"></i>
                            <span class="text-2xl font-black italic">ItsLeo.ISO</span>
                        </a>
                        <a href="mailto:hello@leo.iso" class="flex items-center gap-4 text-white hover:text-[#d34a24] transition-colors group">
                            <i data-lucide="mail" class="w-8 h-8 group-hover:scale-110 transition-transform"></i>
                            <span class="text-2xl font-black italic">hello@leo.iso</span>
                        </a>
                    </div>
                </div>`;
                lucide.createIcons();
            }
        }

        function openProjects() { 
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active-tab'));
            document.getElementById('nav-projects').classList.add('active-tab');
            viewport.classList.add('is-projects-active'); 
        }
        
        function closeProjects() { 
            viewport.classList.remove('is-projects-active'); 
            switchMainTab('home');
        }

        function loadProjectDir(category, el) {
            document.querySelectorAll('#folder-list .finder-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            const filtered = gallery.filter(item => item.cat === category);
            fileList.innerHTML = filtered.map(item => `<div class="finder-item" onclick="previewFile(${item.id})"><i data-lucide="file-text" class="w-4 h-4 opacity-40"></i>${item.src}</div>`).join('');
            lucide.createIcons();
        }

        function previewFile(id) {
            const item = gallery.find(g => g.id === id);
            filePreview.innerHTML = `
                <div class="w-full h-48 bg-white/5 rounded-lg mb-6 flex items-center justify-center overflow-hidden"><img src="${item.src}" class="max-w-full max-h-full object-contain opacity-70" onerror="this.style.display='none'"></div>
                <h4 class="text-white text-sm font-bold mb-1">${item.title}</h4>
                <p class="text-[10px] opacity-40 italic mb-4">${item.intent}</p>
                <button onclick="openOverlay('${item.src}')" class="w-full px-5 py-2 border border-white/10 rounded text-[10px] hover:bg-white hover:text-black transition-all font-bold uppercase tracking-widest">View Full Res</button>
            `;
        }

        // --- MOBILE LOGIC ---
        function mobileSwitchTab(tab) {
            const mArea = document.getElementById('mobile-content-area');
            mArea.classList.remove('fade-in');
            void mArea.offsetWidth;
            mArea.classList.add('fade-in');

            if (tab === 'projects') {
                mArea.innerHTML = gallery.map(item => `
                    <div class="mobile-card" onclick="openOverlay('${item.src}')">
                        <div class="w-full h-40 bg-white/5 rounded mb-4 overflow-hidden"><img src="${item.src}" class="w-full h-full object-cover opacity-60" onerror="this.style.display='none'"></div>
                        <div class="text-white text-xs font-black uppercase tracking-widest">${item.title}</div>
                        <div class="text-[9px] opacity-30 mt-1 uppercase">${item.cat}</div>
                    </div>
                `).join('');
            } else if (tab === 'home') {
                mArea.innerHTML = `
                <div class="mobile-card py-20 text-center">
                    <div class="text-6xl font-black opacity-10 mb-2 italic">Hi!</div>
                    <p class="text-[10px] tracking-[0.3em] opacity-40 uppercase">Welcome to my portfolio</p>
                </div>`;
            } else if (tab === 'about') {
                mArea.innerHTML = `
                <div class="flex flex-col gap-4">
                    <div class="bg-[#d34a24] text-black p-6 rounded min-h-[300px]">
                        <h3 class="font-black italic text-2xl mb-4 uppercase">About</h3>
                        <p class="text-xs font-bold leading-relaxed">16 years old. ISO based. Capturing Switzerland. My work focuses on finding beauty in technical precision and raw lighting.</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-[#d34a24] text-black h-40 flex flex-col items-center justify-center rounded">
                             <i data-lucide="user" class="w-8 h-8 mb-2 opacity-50"></i>
                             <span class="text-[8px] font-black uppercase tracking-widest">Me</span>
                        </div>
                        <div class="bg-[#d34a24] text-black h-40 flex flex-col items-center justify-center rounded">
                             <i data-lucide="camera" class="w-10 h-10 opacity-40"></i>
                             <span class="text-[8px] font-black uppercase tracking-widest mt-2">Leo.ISO</span>
                        </div>
                    </div>
                </div>`;
                lucide.createIcons();
            } else if (tab === 'contact') {
                mArea.innerHTML = `
                <div class="mobile-card flex flex-col items-center gap-6 py-12">
                    <a href="https://instagram.com/leo.iso" target="_blank" class="flex flex-col items-center gap-2">
                        <i data-lucide="instagram" class="w-10 h-10 text-white"></i>
                        <span class="text-sm font-black italic text-white">ItsLeo.ISO</span>
                    </a>
                    <a href="mailto:hello@leo.iso" class="flex flex-col items-center gap-2">
                        <i data-lucide="mail" class="w-10 h-10 text-white"></i>
                        <span class="text-sm font-black italic text-white">hello@leo.iso</span>
                    </a>
                </div>`;
                lucide.createIcons();
            }
        }

        const imageOverlay = document.getElementById('image-overlay');
        const overlayImg = document.getElementById('overlay-img');

        function openOverlay(src) {
            overlayImg.src = src;
            imageOverlay.style.display = 'flex';
            setTimeout(() => imageOverlay.classList.add('active'), 10);
        }

        function closeOverlay() {
            imageOverlay.classList.remove('active');
            setTimeout(() => { imageOverlay.style.display = 'none'; overlayImg.src = ''; }, 300);
        }

        document.addEventListener('keydown', (e) => { if (e.key === "Escape") closeOverlay(); });
    </script>
</body>
</html>
